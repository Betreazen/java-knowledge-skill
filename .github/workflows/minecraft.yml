name: minecraft
# Собирает шаблоны модов и плагинов Minecraft из справочников minecraft-*.md
# и запускает их в настоящей игре или на сервере.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/minecraft/**'
      - '.github/workflows/minecraft.yml'
      # скрипты навыка, которые этот workflow запускает на настоящих серверах
      - 'java-knowledge/scripts/tick_sprint_bench.sh'
      - 'java-knowledge/scripts/EmptyStructure.java'
      - 'java-knowledge/scripts/BenchCompare.java'
  pull_request:
    paths:
      - 'tests/minecraft/**'
      - '.github/workflows/minecraft.yml'
      - 'java-knowledge/scripts/tick_sprint_bench.sh'
      - 'java-knowledge/scripts/EmptyStructure.java'
      - 'java-knowledge/scripts/BenchCompare.java'
permissions:
  contents: read

jobs:
  paper-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/minecraft/paper-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and MockBukkit test
        run: ./gradlew build --stacktrace
      - name: Start Paper 26.3 with the plugin
        working-directory: .
        run: bash tests/minecraft/paper_smoke.sh
      - name: World benchmark with /tick sprint, compared by BenchCompare
        working-directory: tests/minecraft/paper-plugin/run
        run: |
          S=../../../../java-knowledge/scripts
          bash $S/tick_sprint_bench.sh paper.jar a.json 3 400 64 paper
          bash $S/tick_sprint_bench.sh paper.jar b.json 3 400 64 paper
          set +e
          java $S/BenchCompare.java a.json b.json
          test $? -ne 2

  velocity-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/minecraft/velocity-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build (annotation processor generates velocity-plugin.json)
        run: |
          ./gradlew build --stacktrace
          unzip -p build/libs/*.jar velocity-plugin.json

  fabric-mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/minecraft/fabric-mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests and server gametests (headless server)
        run: ./gradlew build --stacktrace
      - name: Version expanded in fabric.mod.json
        run: |
          unzip -p build/libs/examplemod-1.0.0.jar fabric.mod.json | grep '"version": "1.0.0"'
      - name: Fabric server with the mod, /tick sprint benchmark
        run: |
          mkdir -p srv/mods
          cp build/libs/examplemod-1.0.0.jar srv/mods/
          curl -sfL -o srv/mods/fabric-api.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.165.2+26.3/fabric-api-0.165.2+26.3.jar'
          curl -sfL -o srv/fabric-server-launch.jar 'https://meta.fabricmc.net/v2/versions/loader/26.3/0.20.1/1.1.2/server/jar'
          cd srv
          echo eula=true > eula.txt
          bash ../../../../java-knowledge/scripts/tick_sprint_bench.sh 'java -Xmx2G -jar fabric-server-launch.jar nogui' a.json 3 400 64 fabric
          grep -E 'examplemod|Example mod initialised' logs/latest.log | head -5
          grep -q 'Example mod initialised' logs/latest.log
      - name: A broken assertion must fail the gametest run
        run: |
          sed -i 's/block == Blocks.DIAMOND_BLOCK/block == Blocks.GOLD_BLOCK/' src/gametest/java/com/example/test/ExampleModGameTest.java
          if ./gradlew runGameTest; then echo 'gametest did not fail'; exit 1; fi

  neoforge-mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/minecraft/neoforge-mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Empty 3x3x3 structure for the gametest
        run: java ../../../java-knowledge/scripts/EmptyStructure.java src/main/resources/data/examplemod/structure/empty.nbt 5023 3
      - name: Build (ModDevGradle skips recompilation because CI=true)
        run: ./gradlew build --stacktrace
      - name: Run gametests on a headless server
        run: ./gradlew runGameTestServer --stacktrace
      - name: A broken assertion must fail the gametest run
        run: |
          sed -i 's/block == Blocks.DIAMOND_BLOCK/block == Blocks.GOLD_BLOCK/' src/main/java/com/example/examplemod/ExampleMod.java
          if ./gradlew runGameTestServer; then echo 'gametest did not fail'; exit 1; fi
          git checkout -- src/main/java/com/example/examplemod/ExampleMod.java
      - name: NeoForge server with the mod, /tick sprint benchmark
        run: |
          mkdir -p srv/mods
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} srv/mods/ \;
          cd srv
          curl -sfL -o installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/26.3.0.101/neoforge-26.3.0.101-installer.jar
          java -jar installer.jar --installServer > install.log 2>&1 || { tail -20 install.log; exit 1; }
          echo eula=true > eula.txt
          bash ../../../../java-knowledge/scripts/tick_sprint_bench.sh 'bash run.sh nogui' a.json 3 400 64 neoforge
          grep -i -E 'examplemod' logs/latest.log | head -5
      - name: mods.toml expanded in the jar
        run: unzip -p build/libs/*.jar META-INF/neoforge.mods.toml | head -20
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-gametest-logs
          path: tests/minecraft/neoforge-mod/run/logs/
