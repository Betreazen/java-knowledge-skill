name: minecraft
# Собирает шаблоны модов и плагинов Minecraft из справочников minecraft-*.md
# и запускает их в настоящей игре или на сервере.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/minecraft/**'
      - '.github/workflows/minecraft.yml'
  pull_request:
    paths:
      - 'tests/minecraft/**'
permissions:
  contents: read

jobs:
  paper-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/minecraft/paper-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and MockBukkit test
        run: ./gradlew build --stacktrace
      - name: Start Paper 26.3 with the plugin
        working-directory: .
        run: bash tests/minecraft/paper_smoke.sh
      - name: World benchmark with /tick sprint, compared by BenchCompare
        working-directory: tests/minecraft/paper-plugin/run
        run: |
          S=../../../../java-knowledge/scripts
          bash $S/tick_sprint_bench.sh paper.jar a.json 3 400 64 paper
          bash $S/tick_sprint_bench.sh paper.jar b.json 3 400 64 paper
          set +e
          java $S/BenchCompare.java a.json b.json
          test $? -ne 2

  velocity-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/minecraft/velocity-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build (annotation processor generates velocity-plugin.json)
        run: |
          ./gradlew build --stacktrace
          unzip -p build/libs/*.jar velocity-plugin.json

  fabric-mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/minecraft/fabric-mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests and server gametests (headless server)
        run: ./gradlew build --stacktrace
      - name: Version expanded in fabric.mod.json
        run: |
          unzip -p build/libs/examplemod-1.0.0.jar fabric.mod.json | grep '"version": "1.0.0"'

  neoforge-mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/minecraft/neoforge-mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Empty 3x3x3 structure for the gametest
        run: java ../../../java-knowledge/scripts/EmptyStructure.java src/main/resources/data/examplemod/structure/empty.nbt 5023 3
      - name: Build (ModDevGradle skips recompilation because CI=true)
        run: ./gradlew build --stacktrace
      - name: Run gametests on a headless server
        run: ./gradlew runGameTestServer --stacktrace
      - name: mods.toml expanded in the jar
        run: unzip -p build/libs/*.jar META-INF/neoforge.mods.toml | head -20
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-gametest-logs
          path: tests/minecraft/neoforge-mod/run/logs/
