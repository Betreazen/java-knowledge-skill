name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    defaults: # skill-ci
      run: # skill-ci
        working-directory: tests/templates/maven # skill-ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['25', '27']        # LTS you ship on + newest GA as an early warning
        include:
          - os: windows-latest   # catch path/line-ending issues once
            java: '25'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test, lint, coverage gate
        run: ./mvnw -B -ntp verify
        shell: bash
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}-${{ matrix.java }}
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco

  # Gradle variant of the same gate (keep only the job that matches your build)
  gradle:
    defaults: # skill-ci
      run: # skill-ci
        working-directory: tests/templates/gradle # skill-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6   # validates the wrapper jar by default
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew build

  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: |-
        --recursive
        ./

  # Jobs below check the skill itself: docs and scripts # skill-ci
  docs: # skill-ci
    runs-on: ubuntu-latest # skill-ci
    steps: # skill-ci
      - uses: actions/checkout@v7 # skill-ci
      - uses: actions/setup-node@v7 # skill-ci
        with: # skill-ci
          node-version: '24' # skill-ci
      - run: node tests/check_docs.mjs # skill-ci

  bench-compare: # skill-ci
    runs-on: ${{ matrix.os }} # skill-ci
    strategy: # skill-ci
      fail-fast: false # skill-ci
      matrix: # skill-ci
        os: [ubuntu-latest] # skill-ci
        java: ['17', '25'] # skill-ci
        include: # skill-ci
          - os: windows-latest # skill-ci
            java: '25' # skill-ci
    steps: # skill-ci
      - uses: actions/checkout@v7 # skill-ci
      - uses: actions/setup-java@v6 # skill-ci
        with: # skill-ci
          distribution: temurin # skill-ci
          java-version: ${{ matrix.java }} # skill-ci
      - run: bash tests/bench_compare_test.sh # skill-ci
        shell: bash # skill-ci
