name: profilers
# Проверяет сниппет JMH из performance.md и утверждения справочника о профайлерах Linux:
# async-profiler и JFR CPU-time sampling (JEP 509) работают без root при perf_event_paranoid=4,
# а perfnorm/perfasm без доступа к аппаратным счётчикам не запускаются.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/jmh/**'
      - '.github/workflows/profilers.yml'
permissions:
  contents: read

jobs:
  jmh:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: tests/jmh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build benchmarks.jar from the performance.md fragment
        run: mvn -B -ntp package
      - name: Benchmarks are found (fails on JDK 23+ without annotationProcessorPaths)
        run: java -jar target/benchmarks.jar -l | grep -q 'demo.JoinBench.concat'
      - name: Two short runs with -prof gc and BenchCompare
        run: |
          for i in 1 2; do
            java -jar target/benchmarks.jar -f 1 -wi 2 -i 3 -w 1s -r 1s -p size=1000 -prof gc -rf json -rff run$i.json
          done
          set +e
          java ../../java-knowledge/scripts/BenchCompare.java run1.json run2.json
          test $? -ne 2

  linux-profilers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/jmh
    env:
      SHORT: -f 1 -wi 2 -i 3 -w 1s -r 1s -p size=1000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp -q package
      - name: Environment
        run: |
          uname -r
          grep PRETTY_NAME /etc/os-release
          echo "perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)"
          java -version
      - name: Download async-profiler 4.6
        run: |
          curl -sL https://github.com/async-profiler/async-profiler/releases/download/v4.6/async-profiler-4.6-linux-x64.tar.gz | tar xz
          echo "AP=$PWD/async-profiler-4.6-linux-x64/lib/libasyncProfiler.so" >> "$GITHUB_ENV"
      - name: async-profiler cpu flame graph without root
        run: |
          java -jar target/benchmarks.jar demo.JoinBench.concat $SHORT -prof "async:libPath=$AP;event=cpu;output=flamegraph;dir=prof-cpu" > cpu.log 2>&1
          ls -la prof-cpu/*/flame-cpu-forward.html
          grep -q 'JoinBench' prof-cpu/*/flame-cpu-forward.html
      - name: async-profiler allocation profile without root
        run: |
          java -jar target/benchmarks.jar demo.JoinBench.concat $SHORT -prof "async:libPath=$AP;event=alloc;output=collapsed;dir=prof-alloc" > alloc.log 2>&1
          head -c 600 prof-alloc/*/collapsed-alloc.csv; echo
          test -s prof-alloc/*/collapsed-alloc.csv
      - name: JFR CPU-time sampling (JEP 509) records samples on Linux
        run: |
          java -jar target/benchmarks.jar demo.JoinBench.concat $SHORT -jvmArgsAppend "-XX:StartFlightRecording=jdk.CPUTimeSample#enabled=true,filename=$PWD/cpu.jfr" > jfr.log 2>&1
          jfr summary cpu.jfr | grep -E 'CPUTimeSample|ExecutionSample'
          jfr view cpu-time-hot-methods cpu.jfr | head -8
          samples=$(jfr summary cpu.jfr | awk '$1 == "jdk.CPUTimeSample" {print $2}')
          test "${samples:-0}" -gt 0
      - name: perfnorm needs hardware counters (absent on hosted runners)
        run: |
          set +e
          out=$(java -jar target/benchmarks.jar demo.JoinBench.builder $SHORT -prof perfnorm 2>&1)
          echo "$out" | grep -v WARNING | tail -8
          echo "$out" | grep -q 'Profilers failed to initialize'
